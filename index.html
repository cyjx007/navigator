<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个简洁优雅的个人导航网站，支持分类管理、链接拖拽排序、深色模式、云端同步。">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>导航</title>

    <script>
        // 首屏渲染前先定好主题，避免深色模式下先白闪一下
        (function () {
            try {
                if (localStorage.getItem('nav_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* 隐私模式禁用 localStorage 时忽略 */ }
        })();
    </script>

    <!-- SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E" type="image/svg+xml">

    <!-- 资源统一带版本号，避免旧缓存导致改动不生效 -->
    <link href="style.css?v=2.3.0" rel="stylesheet" type="text/css">
    <link rel="manifest" href="manifest.json">
    <!-- 拼音首字母表：空闲时预取，真正输入时已经在缓存里；加载失败不影响使用 -->
    <link rel="prefetch" href="pinyin.js?v=2.3.0">

    <script src="app.js?v=2.3.0" defer></script>
    <script>
        // 注册 Service Worker（相对路径，兼容子目录部署）
        if ('serviceWorker' in navigator) {
            // 新版本 SW 接管后自动刷新一次，确保用户看到最新内容
            var swRefreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (swRefreshing) return;
                swRefreshing = true;
                window.location.reload();
            });

            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(function(registration) {
                        console.log('SW registered:', registration.scope);
                        // 主动检查更新
                        registration.update();
                        registration.addEventListener('updatefound', function() {
                            var newWorker = registration.installing;
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // 立即启用新版本
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch(function(error) {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</head>
<body>
    <!-- ===== 顶部导航栏 ===== -->
    <div class="nav-header">
        <div class="nav-header__container">
            <div class="nav-header__logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">Navigator</span>
                <span class="nav-header__clock" id="headerClock"></span>
            </div>
            <div class="nav-header__actions">
                <div class="nav-header__btn" id="themeToggleBtn" role="button" tabindex="0" title="切换深浅模式" aria-label="切换深浅模式">🌙</div>
                <div class="nav-header__btn nav-header__btn--ghost" id="collapseAllBtn" role="button" tabindex="0" title="一键折叠 / 展开所有分类">折叠全部</div>
                <div class="nav-header__btn" id="categoryManageBtn" role="button" tabindex="0">分类管理</div>
                <div class="nav-header__btn" id="addLinkBtn" role="button" tabindex="0">增加链接</div>
                <div class="nav-header__btn" id="settingsBtn" role="button" tabindex="0">设置</div>
            </div>
        </div>
    </div>

    <!-- ===== Toast 通知容器（底部居中，读屏会播报）===== -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- ===== 设置面板 ===== -->
    <div id="settingsPanel" class="settings-panel is-hidden" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
        <div class="settings-panel__content">
            <div class="settings-panel__header" id="settingsPanelHeader">
                <h3 id="settingsTitle">设置</h3>
                <button class="settings-close" id="settingsClose" aria-label="关闭设置面板">&times;</button>
            </div>
            <div class="settings-panel__body">
                <div id="configStatus" class="config-status">
                    <div id="configStatusText"></div>
                </div>

                <div class="settings-item">
                    <label>Cloudflare Worker URL</label>
                    <input type="text" id="workerUrl" class="input-worker-url" placeholder="https://your-worker.workers.dev">
                </div>
                <div class="settings-item">
                    <label>API Token</label>
                    <input type="password" id="apiToken" class="input-api-token" placeholder="Worker 的 NAV_TOKEN（没设 secret 时随便填）" autocomplete="off">
                </div>
                <div class="settings-item">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button class="settings-btn" id="loginBtn">登录</button>
                        <button class="settings-btn settings-btn--secondary sync-btn" id="downloadFromCloudBtn" style="display: none;">下载云端数据</button>
                        <button class="settings-btn sync-btn" id="uploadToCloudBtn" style="display: none;">上传到云端</button>
                    </div>
                    <span id="syncStatus" class="sync-status-text"></span>
                </div>

                <div id="syncInfo" class="sync-info">
                    <div id="lastSyncTime"></div>
                    <div id="syncStatusInfo"></div>
                </div>

                <div class="settings-item">
                    <label>数据管理</label>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <button class="settings-btn settings-btn--secondary" id="exportDataBtn">导出数据</button>
                        <button class="settings-btn settings-btn--secondary" id="importDataBtn">导入数据</button>
                        <button class="settings-btn settings-btn--danger" id="resetDataBtn">清理本地数据</button>
                        <input type="file" id="importDataInput" accept=".json" style="display: none;">
                    </div>
                    <div style="margin-top: 10px; font-size: 12px; color: var(--text-secondary);">
                        清理本地数据将恢复到初始状态，清空所有分类和链接
                    </div>
                </div>

                <div class="settings-item">
                    <label>诊断信息</label>
                    <div class="diag-box">
                        <div class="diag-row"><span>页面版本</span><b id="diagVersion">—</b></div>
                        <div class="diag-row"><span>识图引擎</span><b id="diagLens">—</b></div>
                        <div class="diag-row"><span>沙箱桥 Origin</span><b id="diagOrigin">检测中…</b></div>
                        <div class="diag-row"><span>运行环境</span><b id="diagProto">—</b></div>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="settings-btn settings-btn--secondary" id="recheckLensBtn" style="flex: 1;">重新检测识图</button>
                        <button class="settings-btn settings-btn--secondary" id="forceRefreshBtn" style="flex: 1;">强制刷新</button>
                    </div>
                    <div style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">
                        「沙箱桥 Origin」应为 <b>null</b>（绿色）；若不是，识图会自动改用剪贴板方式
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 添加链接模态框 ===== -->
    <div id="addLinkModal" class="settings-panel is-hidden" role="dialog" aria-labelledby="addLinkTitle" aria-modal="true">
        <div class="settings-panel__content">
            <div class="settings-panel__header" id="addLinkModalHeader">
                <h3 id="addLinkTitle">添加链接</h3>
                <button class="settings-close" id="addLinkClose" aria-label="关闭添加链接面板">&times;</button>
            </div>
            <div class="settings-panel__body">
                <div class="settings-item">
                    <label for="linkNameInput">网站名称</label>
                    <input type="text" id="linkNameInput" class="input-link-name" placeholder="输入网站名称">
                </div>
                <div class="settings-item">
                    <label for="linkUrlInput">网站URL</label>
                    <input type="text" id="linkUrlInput" class="input-link-url" placeholder="https://example.com">
                </div>
                <div class="settings-item">
                    <label for="linkCategorySelect">添加到</label>
                    <select id="linkCategorySelect" class="input-link-category">
                    </select>
                </div>
                <div class="settings-item" style="display: flex; gap: 10px;">
                    <button class="settings-btn" id="saveLinkBtn" style="flex: 1;">保存</button>
                    <button class="settings-btn settings-btn--secondary" id="cancelLinkBtn" style="flex: 1;">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 右键菜单 ===== -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu__item" id="editLinkBtn">✏️ 编辑</div>
        <div class="context-menu__item" id="colorLinkBtn">🎨 颜色</div>
        <div class="context-menu__item" id="deleteLinkBtn">🗑️ 删除</div>
    </div>

    <!-- ===== 编辑链接模态框 ===== -->
    <div id="editLinkModal" class="settings-panel is-hidden" role="dialog" aria-labelledby="editLinkTitle" aria-modal="true">
        <div class="settings-panel__content">
            <div class="settings-panel__header" id="editLinkModalHeader">
                <h3 id="editLinkTitle">编辑链接</h3>
                <button class="settings-close" id="editLinkClose" aria-label="关闭编辑链接面板">&times;</button>
            </div>
            <div class="settings-panel__body">
                <div class="settings-item">
                    <label for="editLinkNameInput">链接名称</label>
                    <input type="text" id="editLinkNameInput" class="input-edit-link-name" placeholder="输入链接名称">
                </div>
                <div class="settings-item">
                    <label for="editLinkUrlInput">链接地址</label>
                    <input type="text" id="editLinkUrlInput" class="input-edit-link-url" placeholder="输入链接地址">
                </div>
                <div class="settings-item" style="display: flex; gap: 10px;">
                    <button class="settings-btn" id="saveEditLinkBtn" style="flex: 1;">保存</button>
                    <button class="settings-btn settings-btn--secondary" id="cancelEditLinkBtn" style="flex: 1;">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 分类管理模态框 ===== -->
    <div id="categoryManageModal" class="settings-panel is-hidden" role="dialog" aria-labelledby="categoryManageTitle" aria-modal="true">
        <div class="settings-panel__content" style="max-width: 560px;">
            <div class="settings-panel__header" id="categoryManageModalHeader">
                <h3 id="categoryManageTitle">分类管理</h3>
                <button class="settings-close" id="categoryManageClose" aria-label="关闭分类管理面板">&times;</button>
            </div>
            <div class="settings-panel__body">
                <div class="settings-item" style="border-bottom: 1px solid var(--nav-border); padding-bottom: 15px; margin-bottom: 15px;">
                    <label for="newCategoryNameInput" style="font-weight: bold; margin-bottom: 10px; display: block;">添加新分类</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newCategoryNameInput" class="input-category-name" placeholder="输入分类名称" style="flex: 1;">
                        <button class="settings-btn" id="addNewCategoryBtn">添加</button>
                    </div>
                </div>

                <div class="settings-item">
                    <label style="font-weight: bold; margin-bottom: 10px; display: block;">分类列表</label>
                    <div id="categoryListContainer" style="max-height: 400px; overflow-y: auto;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 通用确认弹窗 ===== -->
    <div id="confirmModal" class="settings-panel is-hidden" role="dialog" aria-modal="true">
        <div class="settings-panel__content" style="max-width: 340px;">
            <div class="settings-panel__header" id="confirmModalHeader">
                <h3 id="confirmTitle">确认操作</h3>
                <button class="settings-close" id="confirmClose" aria-label="关闭">&times;</button>
            </div>
            <div class="settings-panel__body">
                <p class="confirm-text" id="confirmText">确定要执行此操作吗？</p>
                <div class="confirm-buttons">
                    <button class="settings-btn settings-btn--danger" id="confirmYesBtn">确认</button>
                    <button class="settings-btn settings-btn--secondary" id="confirmNoBtn">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 加载覆盖层 ===== -->
    <div id="loadingOverlay" class="loading-overlay is-hidden">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在处理中...</p>
        </div>
    </div>

    <!-- ===== 回到顶部按钮 ===== -->
    <div class="back-to-top" id="backToTop" title="回到顶部">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z" fill="var(--primary-color)"/></svg>
    </div>

    <!-- ===== 主要内容区域 ===== -->
    <div id="bd">
        <!-- 搜索栏 -->
        <div id="searchBar" class="search-box">
            <form id="searchForm" method="get" action="https://www.google.com/search" class="search-form">
                <div class="search-engine-selector" id="searchEngineSelector" role="button" tabindex="0" aria-label="切换搜索引擎">
                    <img src="https://www.google.com/favicon.ico" alt="Google" class="search-engine-icon" data-engine="google">
                    <svg class="search-engine-caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    <div class="search-engine-dropdown" id="searchEngineDropdown">
                        <div class="search-engine-dropdown__item is-active" data-engine="google">
                            <img src="https://www.google.com/favicon.ico" alt="Google">Google
                        </div>
                        <div class="search-engine-dropdown__item" data-engine="bing">
                            <img src="https://www.bing.com/favicon.ico" alt="Bing">Bing
                        </div>
                        <div class="search-engine-dropdown__item" data-engine="baidu">
                            <img src="https://www.baidu.com/favicon.ico" alt="Baidu">百度
                        </div>
                    </div>
                </div>
                <input type="text" class="search-input" id="searchKey" autocomplete="off" name="q" placeholder="搜索...">
                <button type="button" class="search-img-btn" id="imageSearchBtn" title="以图搜图 · Google Lens（点击选图，或粘贴 / 拖入图片）">
                    <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <path d="M21 15l-5-5L5 21"></path>
                    </svg>
                </button>
                <button class="search-btn" type="submit">
                    <svg class="icon" viewBox="0 0 1024 1024" width="22" height="22"><path d="M1024 992l-242.5-242.5C842.3 666.9 896 549.2 896 416 896 186.5 709.5 0 480 0S64 186.5 64 416s186.5 416 416 416c133.2 0 250.9-53.7 333.5-114.5L1024 992zM480 768c-194.9 0-352-157.1-352-352S285.1 64 480 64s352 157.1 352 352-157.1 352-352 352z"></path></svg>
                </button>
            </form>
            <input type="file" id="imageSearchInput" accept="image/*" class="hidden-file-input">

            <!-- 链接快速过滤 -->
            <div class="link-filter-wrapper">
                <svg class="link-filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-1.6a2.9 2.9 0 1 0 0-5.8 2.9 2.9 0 0 0 0 5.8z"/><path d="M10 10l4 4-1.1 1.1-4-4z"/></svg>
                <input type="text" class="link-filter-input" id="linkFilterInput" placeholder="快速过滤已保存的链接…（支持拼音首字母，按 / 聚焦）" title="支持拼音首字母：输入 blbl 可找到「哔哩哔哩」；↑↓ 选择，回车打开" autocomplete="off" spellcheck="false">
                <span class="link-filter-count" id="linkFilterCount" hidden></span>
                <button type="button" class="link-filter-clear" id="linkFilterClear" aria-label="清空过滤" hidden>&times;</button>
            </div>
        </div>

        <div class="clearfix"></div>

        <!-- 链接内容区域 -->
        <div class="main-content">
            <div class="main-content__container">
                <!-- 常用网站 -->
                <div class="category-module category-module__box" data-collapse-key="common">
                    <div class="category-module__header">
                        <div class="inline-block category-module__title-wrapper category-module__title-wrapper--active">
                            <a class="category-module__title">常用网站</a>
                            <span class="category-module__count" id="commonCount">0</span>
                        </div>
                        <button type="button" class="category-module__toggle" aria-expanded="true" aria-label="折叠或展开该分类" title="折叠 / 展开">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                    </div>
                    <div class="category-module__body">
                        <div class="category-module__body-inner">
                            <div id="common-links-content" class="category-module__content">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 其他分类模块 -->
                <div id="category-modules-container">
                </div>
            </div>
        </div>
    </div>

    <script src="main.js?v=2.3.0" defer></script>
</body>
</html>
